<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2" viewBox="0 0 1000 2" role="presentation">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#58A6FF" stop-opacity="0.55"/>
      <stop offset="65%"  stop-color="#58A6FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.6;0;-0.6" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.6;1"     dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="1" fill="url(#rule)"/>
</svg>
