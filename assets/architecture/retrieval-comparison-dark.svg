<svg xmlns="http://www.w3.org/2000/svg" width="880" height="232" viewBox="0 0 880 232" role="img" aria-label="Retrieval approach comparison">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;}</style>
<text x="440.0" y="24" fill="#58A6FF" font-size="14.5" font-weight="700" text-anchor="middle" opacity="1">Conceptual Comparison of Document Retrieval Approaches<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.00s" fill="freeze"/></text>
<g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.07s" fill="freeze"/><rect x="20.0" y="50" width="262.6666666666667" height="148" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/><circle cx="151.33333333333334" cy="72" r="11" fill="#161B22" stroke="#58A6FF" stroke-width="1.2"/><text x="151.33333333333334" y="76" fill="#58A6FF" font-size="10.5" font-weight="700" text-anchor="middle">A</text><text x="151.33333333333334" y="102" fill="#E6EDF3" font-size="11.5" font-weight="600" text-anchor="middle">Keyword (Lexical) Retrieval</text><text x="151.33333333333334" y="124" fill="#8B949E" font-size="10" text-anchor="middle">Matches exact terms and phrasing</text><text x="151.33333333333334" y="141" fill="#8B949E" font-size="10" text-anchor="middle">Strong for policy numbers and codes</text><text x="151.33333333333334" y="158" fill="#8B949E" font-size="10" text-anchor="middle">Lightweight infrastructure</text><text x="151.33333333333334" y="175" fill="#8B949E" font-size="10" text-anchor="middle">Limited semantic understanding</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.14s" fill="freeze"/><line x1="282.6666666666667" y1="124.0" x2="303.6666666666667" y2="124.0" stroke="#6E7681" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.75"><animate attributeName="stroke-dashoffset" from="10" to="0" dur="2.4s" repeatCount="indefinite"/></line><polygon points="308.6666666666667,124.0 303.6666666666667,119.0 303.6666666666667,129.0" fill="#6E7681" opacity="0.85"/></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.14s" fill="freeze"/><rect x="308.6666666666667" y="50" width="262.6666666666667" height="148" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/><circle cx="440.0" cy="72" r="11" fill="#161B22" stroke="#58A6FF" stroke-width="1.2"/><text x="440.0" y="76" fill="#58A6FF" font-size="10.5" font-weight="700" text-anchor="middle">B</text><text x="440.0" y="102" fill="#E6EDF3" font-size="11.5" font-weight="600" text-anchor="middle">Semantic (Vector) Retrieval</text><text x="440.0" y="124" fill="#8B949E" font-size="10" text-anchor="middle">Matches meaning, not exact words</text><text x="440.0" y="141" fill="#8B949E" font-size="10" text-anchor="middle">Handles paraphrased queries</text><text x="440.0" y="158" fill="#8B949E" font-size="10" text-anchor="middle">Higher infrastructure overhead</text><text x="440.0" y="175" fill="#8B949E" font-size="10" text-anchor="middle">Can miss exact-term precision</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.21s" fill="freeze"/><line x1="571.3333333333334" y1="124.0" x2="592.3333333333334" y2="124.0" stroke="#6E7681" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.75"><animate attributeName="stroke-dashoffset" from="10" to="0" dur="2.4s" repeatCount="indefinite"/></line><polygon points="597.3333333333334,124.0 592.3333333333334,119.0 592.3333333333334,129.0" fill="#6E7681" opacity="0.85"/></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.21s" fill="freeze"/><rect x="597.3333333333334" y="50" width="262.6666666666667" height="148" rx="10" fill="#1C2430" stroke="#58A6FF" stroke-width="1"/><circle cx="728.6666666666667" cy="72" r="11" fill="#161B22" stroke="#58A6FF" stroke-width="1.2"/><text x="728.6666666666667" y="76" fill="#58A6FF" font-size="10.5" font-weight="700" text-anchor="middle">C</text><text x="728.6666666666667" y="102" fill="#E6EDF3" font-size="11.5" font-weight="600" text-anchor="middle">Hybrid Retrieval</text><text x="728.6666666666667" y="124" fill="#8B949E" font-size="10" text-anchor="middle">Combines both rankings into one set</text><text x="728.6666666666667" y="141" fill="#8B949E" font-size="10" text-anchor="middle">Balances precision and recall</text><text x="728.6666666666667" y="158" fill="#8B949E" font-size="10" text-anchor="middle">Preferred for multilingual,</text><text x="728.6666666666667" y="175" fill="#8B949E" font-size="10" text-anchor="middle">compliance-sensitive documents</text></g>
<text x="440.0" y="222" fill="#6E7681" font-size="10.5" font-style="italic" text-anchor="middle" opacity="1">Government document repositories favour hybrid retrieval for auditability and multilingual accuracy<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.84s" fill="freeze"/></text>
</svg>