<text x="440.0" y="24" fill="#0969DA" font-size="14.5" font-weight="700" text-anchor="middle" opacity="1">Hybrid RAG Chatbot — System Architecture<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.00s" fill="freeze"/></text>
<g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.07s" fill="freeze"/><circle cx="60" cy="76.0" r="14" fill="#EAEEF2" stroke="#0969DA" stroke-width="1.2"/><text x="60" y="80.0" fill="#0969DA" font-size="11.5" font-weight="700" text-anchor="middle">1</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.07s" fill="freeze"/><rect x="92" y="46" width="748" height="60" rx="8" fill="#EAEEF2" stroke="#0969DA" stroke-width="1"/><text x="466.0" y="74.0" fill="#1F2328" font-size="12.5" font-weight="600" text-anchor="middle">Document Processing Layer</text><text x="466.0" y="89.0" fill="#57606A" font-size="10.5" text-anchor="middle">Ingestion, OCR, preprocessing, metadata extraction, intelligent chunking</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.14s" fill="freeze"/><line x1="466.0" y1="106" x2="466.0" y2="127" stroke="#6E7681" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.75"><animate attributeName="stroke-dashoffset" from="10" to="0" dur="2.4s" repeatCount="indefinite"/></line><polygon points="466.0,132 461.0,127 471.0,127" fill="#6E7681" opacity="0.85"/></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.14s" fill="freeze"/><circle cx="60" cy="162.0" r="14" fill="#EAEEF2" stroke="#0969DA" stroke-width="1.2"/><text x="60" y="166.0" fill="#0969DA" font-size="11.5" font-weight="700" text-anchor="middle">2</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.14s" fill="freeze"/><rect x="92" y="132" width="748" height="60" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="466.0" y="160.0" fill="#1F2328" font-size="12.5" font-weight="600" text-anchor="middle">Embedding Layer</text><text x="466.0" y="175.0" fill="#57606A" font-size="10.5" text-anchor="middle">Multilingual semantic embeddings capturing meaning across document sections</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.21s" fill="freeze"/><line x1="466.0" y1="192" x2="466.0" y2="213" stroke="#6E7681" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.75"><animate attributeName="stroke-dashoffset" from="10" to="0" dur="2.4s" repeatCount="indefinite"/></line><polygon points="466.0,218 461.0,213 471.0,213" fill="#6E7681" opacity="0.85"/></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.21s" fill="freeze"/><circle cx="60" cy="248.0" r="14" fill="#EAEEF2" stroke="#0969DA" stroke-width="1.2"/><text x="60" y="252.0" fill="#0969DA" font-size="11.5" font-weight="700" text-anchor="middle">3</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.21s" fill="freeze"/><rect x="92" y="218" width="748" height="60" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="466.0" y="246.0" fill="#1F2328" font-size="12.5" font-weight="600" text-anchor="middle">Retrieval Layer (Dual Path)</text><text x="466.0" y="261.0" fill="#57606A" font-size="10.5" text-anchor="middle">Semantic vector search and keyword search, combined via rank fusion into one ranked result set</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.28s" fill="freeze"/><line x1="466.0" y1="278" x2="466.0" y2="299" stroke="#6E7681" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.75"><animate attributeName="stroke-dashoffset" from="10" to="0" dur="2.4s" repeatCount="indefinite"/></line><polygon points="466.0,304 461.0,299 471.0,299" fill="#6E7681" opacity="0.85"/></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.28s" fill="freeze"/><circle cx="60" cy="334.0" r="14" fill="#EAEEF2" stroke="#0969DA" stroke-width="1.2"/><text x="60" y="338.0" fill="#0969DA" font-size="11.5" font-weight="700" text-anchor="middle">4</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.28s" fill="freeze"/><rect x="92" y="304" width="748" height="60" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="466.0" y="332.0" fill="#1F2328" font-size="12.5" font-weight="600" text-anchor="middle">AI Generation Layer</text><text x="466.0" y="347.0" fill="#57606A" font-size="10.5" text-anchor="middle">Contextual prompt construction from fused results, local language model inference</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.35s" fill="freeze"/><line x1="466.0" y1="364" x2="466.0" y2="385" stroke="#6E7681" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.75"><animate attributeName="stroke-dashoffset" from="10" to="0" dur="2.4s" repeatCount="indefinite"/></line><polygon points="466.0,390 461.0,385 471.0,385" fill="#6E7681" opacity="0.85"/></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.35s" fill="freeze"/><circle cx="60" cy="420.0" r="14" fill="#EAEEF2" stroke="#0969DA" stroke-width="1.2"/><text x="60" y="424.0" fill="#0969DA" font-size="11.5" font-weight="700" text-anchor="middle">5</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.35s" fill="freeze"/><rect x="92" y="390" width="748" height="60" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="466.0" y="418.0" fill="#1F2328" font-size="12.5" font-weight="600" text-anchor="middle">Presentation Layer</text><text x="466.0" y="433.0" fill="#57606A" font-size="10.5" text-anchor="middle">Conversational interface with citations and retrieval transparency</text></g>
<text x="440.0" y="474" fill="#6E7681" font-size="10.5" font-style="italic" text-anchor="middle" opacity="1">Adds a semantic embedding path and rank fusion on top of the vectorless keyword baseline<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.84s" fill="freeze"/></text>
