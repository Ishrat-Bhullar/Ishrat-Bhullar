<text x="440.0" y="400" fill="#6E7681" font-size="10.5" text-anchor="middle" opacity="1">Deliberately excludes a vector database — retrieval is entirely keyword-driven<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.84s" fill="freeze"/></text>
