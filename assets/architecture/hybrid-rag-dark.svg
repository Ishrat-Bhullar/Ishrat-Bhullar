<svg xmlns="http://www.w3.org/2000/svg" width="880" height="498" viewBox="0 0 880 498" role="img" aria-label="Hybrid RAG Chatbot — System Architecture">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;}</style>
<text x="440.0" y="26" fill="#58A6FF" font-size="14" font-weight="700" letter-spacing="0.4" text-anchor="middle" opacity="1">Hybrid RAG Chatbot — System Architecture<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.00s" fill="freeze"/></text>
<g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.07s" fill="freeze"/><circle cx="60" cy="84.0" r="14" fill="#1C2430" stroke="#58A6FF" stroke-width="1.2"/><text x="60" y="88.0" fill="#58A6FF" font-size="11.5" font-weight="700" text-anchor="middle">1</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.07s" fill="freeze"/><rect x="92" y="54" width="748" height="60" rx="8" fill="#1C2430" stroke="#58A6FF" stroke-width="1"/><text x="466.0" y="82.0" fill="#E6EDF3" font-size="12.5" font-weight="600" text-anchor="middle">Document Processing Layer</text><text x="466.0" y="97.0" fill="#8B949E" font-size="10.5" text-anchor="middle">Ingestion, OCR, preprocessing, metadata extraction, intelligent chunking</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.14s" fill="freeze"/><line x1="466.0" y1="114" x2="466.0" y2="135" stroke="#6E7681" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.75"><animate attributeName="stroke-dashoffset" from="10" to="0" dur="2.4s" repeatCount="indefinite"/></line><polygon points="466.0,140 461.0,135 471.0,135" fill="#6E7681" opacity="0.85"/></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.14s" fill="freeze"/><circle cx="60" cy="170.0" r="14" fill="#1C2430" stroke="#58A6FF" stroke-width="1.2"/><text x="60" y="174.0" fill="#58A6FF" font-size="11.5" font-weight="700" text-anchor="middle">2</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.14s" fill="freeze"/><rect x="92" y="140" width="748" height="60" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="466.0" y="168.0" fill="#E6EDF3" font-size="12.5" font-weight="600" text-anchor="middle">Embedding Layer</text><text x="466.0" y="183.0" fill="#8B949E" font-size="10.5" text-anchor="middle">Multilingual semantic embeddings capturing meaning across document sections</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.21s" fill="freeze"/><line x1="466.0" y1="200" x2="466.0" y2="221" stroke="#6E7681" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.75"><animate attributeName="stroke-dashoffset" from="10" to="0" dur="2.4s" repeatCount="indefinite"/></line><polygon points="466.0,226 461.0,221 471.0,221" fill="#6E7681" opacity="0.85"/></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.21s" fill="freeze"/><circle cx="60" cy="256.0" r="14" fill="#1C2430" stroke="#58A6FF" stroke-width="1.2"/><text x="60" y="260.0" fill="#58A6FF" font-size="11.5" font-weight="700" text-anchor="middle">3</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.21s" fill="freeze"/><rect x="92" y="226" width="748" height="60" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="466.0" y="254.0" fill="#E6EDF3" font-size="12.5" font-weight="600" text-anchor="middle">Retrieval Layer (Dual Path)</text><text x="466.0" y="269.0" fill="#8B949E" font-size="10.5" text-anchor="middle">Semantic vector search and keyword search, combined via rank fusion into one ranked result set</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.28s" fill="freeze"/><line x1="466.0" y1="286" x2="466.0" y2="307" stroke="#6E7681" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.75"><animate attributeName="stroke-dashoffset" from="10" to="0" dur="2.4s" repeatCount="indefinite"/></line><polygon points="466.0,312 461.0,307 471.0,307" fill="#6E7681" opacity="0.85"/></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.28s" fill="freeze"/><circle cx="60" cy="342.0" r="14" fill="#1C2430" stroke="#58A6FF" stroke-width="1.2"/><text x="60" y="346.0" fill="#58A6FF" font-size="11.5" font-weight="700" text-anchor="middle">4</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.28s" fill="freeze"/><rect x="92" y="312" width="748" height="60" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="466.0" y="340.0" fill="#E6EDF3" font-size="12.5" font-weight="600" text-anchor="middle">AI Generation Layer</text><text x="466.0" y="355.0" fill="#8B949E" font-size="10.5" text-anchor="middle">Contextual prompt construction from fused results, local language model inference</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.35s" fill="freeze"/><line x1="466.0" y1="372" x2="466.0" y2="393" stroke="#6E7681" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.75"><animate attributeName="stroke-dashoffset" from="10" to="0" dur="2.4s" repeatCount="indefinite"/></line><polygon points="466.0,398 461.0,393 471.0,393" fill="#6E7681" opacity="0.85"/></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.35s" fill="freeze"/><circle cx="60" cy="428.0" r="14" fill="#1C2430" stroke="#58A6FF" stroke-width="1.2"/><text x="60" y="432.0" fill="#58A6FF" font-size="11.5" font-weight="700" text-anchor="middle">5</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.35s" fill="freeze"/><rect x="92" y="398" width="748" height="60" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="466.0" y="426.0" fill="#E6EDF3" font-size="12.5" font-weight="600" text-anchor="middle">Presentation Layer</text><text x="466.0" y="441.0" fill="#8B949E" font-size="10.5" text-anchor="middle">Conversational interface with citations and retrieval transparency</text></g>
<text x="440.0" y="486" fill="#6E7681" font-size="10.5" text-anchor="middle" opacity="1">Adds a semantic embedding path and rank fusion on top of the vectorless keyword baseline<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.84s" fill="freeze"/></text>
