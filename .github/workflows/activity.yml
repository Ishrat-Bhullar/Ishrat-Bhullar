name: Refresh recent activity

on:
  schedule:
    # Every six hours, off the hour to avoid GitHub's peak-of-hour scheduling backlog.
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/generate_activity.py
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rewrite the activity block in README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
          MAX_LINES: "5"
        run: python3 scripts/generate_activity.py

      - name: Commit refreshed activity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "Activity unchanged; nothing to commit."
          else
            git commit -m "chore(readme): refresh recent activity feed"
            git push
          fi
